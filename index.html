<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eduplan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- <header> é uma tag semântica: ela existe especificamente para marcar o cabeçalho do site.
    class="header" conecta essa tag com o CSS -->
    <header class="header">

        <!-- Essa div é só um "envelope" interno, usado para limitar a largura do conteúdo e organizar os itens com Flexbox -->
        <div class="header-inner">

            <a href="#" class="logo">

                <img src="./assets/estetica-removebg-preview.png" alt="Logo Estetica">

                <h2 style="color: rgb(116, 45, 104);">
                    Estetica <span style="color: #8d0aad;">7</span>
                </h2>

            </a>

            <ul class="nav" id="nav">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Horarios</a></li>
                <li><a href="#">Referencias</a></li>
                <li><a href="#">Agendamento</a></li>
                <li><a href="#">Contato</a></li>    
            </ul>

            <div class="actions">
                <a href="#" class="btn btn-entrar">Entrar</a>
                <a href="#" class="btn btn-cadastrar">Cadastrar</a>
            </div>
        </div>

    </header>

</body>

</html>
